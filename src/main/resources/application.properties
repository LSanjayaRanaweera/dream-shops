# 1. Application IDENTITY
spring.application.name=dream-shops

# 2. Server configuration
#The Default server port for Spring Boot projects is port: 8080 
#Assigning port 9193 (tutorial) -- assigning a different port to avoid conflicts with other applications running on the default port
server.port=9193

# 3. Database connection
# HOST: localhost, PORT: 3306 (default MySQL port), DB name: dream_shops_db
spring.datasource.url=jdbc:mysql://localhost:3306/dream_shops_db
spring.datasource.username=root
# PASSWORD == root password to log in to MySQL
spring.datasource.password=Tumbleweed42
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. Hibernate dialect
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect

# 5. SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 6. Schema generation
##(create, update, create-drop, validate)
# The line below should auto generate >> create MySQL tables upon running the program
spring.jpa.hibernate.ddl-auto=update

#7. Configuration property that sets Base PATH prefix to all API routes
api.prefix=/api/v1